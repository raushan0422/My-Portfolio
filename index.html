    <meta name="description" content="Portfolio of Raushan Kumar, an AI/ML Engineer specializing in Computer Vision, NLP, and GenAI. B.Tech Graduate 2026." />
    <script>
      // Suppress benign environment errors that can appear in the preview
      window.addEventListener('unhandledrejection', (event) => {
        if (event.reason && (
          event.reason.message?.includes('WebSocket') || 
          event.reason.message?.includes('vite')
        )) {
          event.preventDefault();
        }
      });
      window.addEventListener('error', (event) => {
        if (event.message?.includes('WebSocket') || event.message?.includes('vite')) {
          event.stopImmediatePropagation();
        }
      }, true);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
